<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Les nombres décimaux — CM2</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Source+Serif+4:wght@400;600&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bleu:     #1a2744;
      --bleu-mid: #2d4278;
      --or:       #c9a84c;
      --rouge:    #b5292a;
      --blanc:    #f5f5ef;
      --gris:     #e4e4dc;
      --gris-mid: #c8c8bc;
      --texte:    #1c1c1c;
      --vert:     #2e7d5e;
      --radius:   12px;
      --shadow:   0 4px 24px rgba(26,39,68,.10);
    }

    body {
      background: var(--blanc);
      color: var(--texte);
      font-family: 'Nunito', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 28px 16px 60px;
    }

    /* EN-TETE */
    header {
      width: 100%;
      max-width: 680px;
      margin-bottom: 22px;
    }
    .header-inner {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 18px;
    }
    .drapeau {
      display: flex;
      gap: 4px;
      padding-top: 4px;
      flex-shrink: 0;
    }
    .drapeau span {
      display: block;
      width: 8px;
      height: 36px;
      border-radius: 2px;
    }
    .drapeau .bl { background: var(--bleu); }
    .drapeau .wh { background: #fff; border: 1px solid #ddd; }
    .drapeau .rd { background: var(--rouge); }

    .header-texte .sous-titre {
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--or);
      margin-bottom: 4px;
    }
    .header-texte h1 {
      font-family: 'Source Serif 4', Georgia, serif;
      font-size: 1.4rem;
      font-weight: 600;
      color: var(--bleu);
      line-height: 1.25;
    }

    /* INDICATEUR DE POSITION */
    .position-bar {
      display: flex;
      gap: 6px;
      align-items: center;
      flex-wrap: wrap;
    }
    .niveau-pip {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }
    .pip-label {
      font-size: 0.6rem;
      font-weight: 800;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      color: var(--gris-mid);
      transition: color .3s;
    }
    .niveau-actif .pip-label { color: var(--bleu); }
    .pip-exercices {
      display: flex;
      gap: 5px;
    }
    .pip-ex {
      display: flex;
      gap: 2px;
    }
    .pip {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--gris);
      transition: background .3s, transform .2s;
    }
    .pip.actif  { background: var(--or);   transform: scale(1.25); }
    .pip.reussi { background: var(--vert); }
    .pip.echoue { background: var(--rouge); }

    .sep-niveau {
      width: 14px;
      height: 2px;
      background: var(--gris);
      margin-bottom: 14px;
      flex-shrink: 0;
    }

    /* CARTE */
    .card {
      width: 100%;
      max-width: 680px;
      background: #fff;
      border-radius: var(--radius);
      border: 1px solid var(--gris);
      box-shadow: var(--shadow);
      padding: 32px 36px 28px;
      min-height: 360px;
      display: flex;
      flex-direction: column;
    }

    /* Badges */
    .badge-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 18px;
      flex-wrap: wrap;
    }
    .badge-niveau {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      background: var(--bleu);
      color: #fff;
      font-size: 0.68rem;
      font-weight: 800;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 5px 13px;
      border-radius: 99px;
    }
    .badge-niveau .puce {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--or);
    }
    .badge-exercice {
      font-size: 0.68rem;
      font-weight: 700;
      color: var(--gris-mid);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    /* Compteur sous-exercices */
    .sous-ex-compteur {
      display: flex;
      gap: 6px;
      margin-bottom: 20px;
    }
    .sous-ex-dot {
      width: 28px;
      height: 5px;
      border-radius: 99px;
      background: var(--gris);
      transition: background .3s;
    }
    .sous-ex-dot.actif  { background: var(--or); }
    .sous-ex-dot.ok     { background: var(--vert); }
    .sous-ex-dot.nok    { background: var(--rouge); }

    /* Énoncé */
    .enonce {
      font-family: 'Source Serif 4', Georgia, serif;
      font-size: 1.12rem;
      line-height: 1.65;
      color: var(--bleu);
      margin-bottom: 24px;
    }
    .enonce strong { color: var(--rouge); font-weight: 600; }

    /* Options QCM */
    .options {
      display: flex;
      flex-direction: column;
      gap: 9px;
      margin-bottom: 22px;
    }
    .opt {
      display: flex;
      align-items: center;
      gap: 12px;
      border: 1.5px solid var(--gris);
      border-radius: 8px;
      background: #fff;
      padding: 12px 15px;
      cursor: pointer;
      font-size: 0.94rem;
      font-family: 'Nunito', sans-serif;
      font-weight: 600;
      color: var(--texte);
      text-align: left;
      transition: border-color .15s, background .15s;
      width: 100%;
    }
    .opt:hover:not(:disabled) { border-color: var(--bleu); background: #f0f3fa; }
    .opt:disabled { cursor: default; }
    .opt .lettre {
      width: 30px; height: 30px;
      border-radius: 50%;
      background: var(--gris);
      color: var(--bleu);
      font-weight: 800;
      font-size: 0.8rem;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      transition: background .15s, color .15s;
    }
    .opt.selectionne             { border-color: var(--bleu); background: #eef1fa; }
    .opt.selectionne .lettre     { background: var(--bleu); color: #fff; }
    .opt.correct                 { border-color: var(--vert); background: #edf7f2; }
    .opt.correct .lettre         { background: var(--vert); color: #fff; }
    .opt.faux                    { border-color: var(--rouge); background: #fdf0f0; }
    .opt.faux .lettre            { background: var(--rouge); color: #fff; }

    /* Feedback */
    .feedback {
      border-radius: 8px;
      padding: 12px 15px;
      font-size: 0.87rem;
      font-weight: 600;
      line-height: 1.5;
      margin-bottom: 20px;
      display: none;
    }
    .feedback.ok  { background: #edf7f2; border-left: 4px solid var(--vert);  color: #1a5c3c; }
    .feedback.nok { background: #fdf0f0; border-left: 4px solid var(--rouge); color: #7a1515; }

    /* Boutons */
    .actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: auto; padding-top: 4px; }
    .btn {
      padding: 11px 24px;
      border-radius: 8px;
      font-size: 0.88rem;
      font-weight: 800;
      font-family: 'Nunito', sans-serif;
      cursor: pointer;
      border: none;
      letter-spacing: 0.02em;
      transition: opacity .15s, transform .1s;
    }
    .btn:hover:not(:disabled) { opacity: .88; transform: translateY(-1px); }
    .btn:active:not(:disabled) { transform: translateY(0); }
    .btn:disabled { opacity: .38; cursor: default; }
    .btn-valider { background: var(--bleu); color: #fff; }
    .btn-suite   { background: var(--or);   color: #fff; }

    /* BILAN EXERCICE */
    .ecran-bilan {
      display: none;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 14px;
      flex-grow: 1;
      justify-content: center;
      padding: 12px 0;
    }
    .bilan-icone { font-size: 2.6rem; }
    .bilan-score {
      font-family: 'Source Serif 4', serif;
      font-size: 2rem;
      font-weight: 600;
      color: var(--bleu);
    }
    .bilan-score span {
      font-size: 1rem;
      color: var(--gris-mid);
      font-family: 'Nunito', sans-serif;
    }
    .ecran-bilan h2 {
      font-family: 'Source Serif 4', serif;
      font-size: 1.15rem;
      color: var(--bleu);
    }
    .ecran-bilan p {
      font-size: 0.88rem;
      color: #666;
      line-height: 1.55;
      max-width: 420px;
    }
    .detail-sous-ex {
      display: flex;
      gap: 8px;
      justify-content: center;
    }
    .detail-puce {
      width: 32px; height: 32px;
      border-radius: 50%;
      font-size: 0.8rem;
      font-weight: 800;
      display: flex; align-items: center; justify-content: center;
      color: #fff;
    }
    .detail-puce.ok  { background: var(--vert); }
    .detail-puce.nok { background: var(--rouge); }

    /* ECRAN TRANSITION NIVEAU */
    .ecran-transition {
      display: none;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 14px;
      flex-grow: 1;
      justify-content: center;
      padding: 12px 0;
    }
    .transition-icone { font-size: 2.6rem; }
    .ecran-transition h2 {
      font-family: 'Source Serif 4', serif;
      font-size: 1.15rem;
      color: var(--bleu);
    }
    .ecran-transition p {
      font-size: 0.88rem;
      color: #666;
      line-height: 1.55;
      max-width: 420px;
    }

    /* ECRAN FIN */
    .ecran-fin {
      display: none;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 18px;
      flex-grow: 1;
      justify-content: center;
    }
    .ecran-fin .trophee { font-size: 3.5rem; }
    .ecran-fin h2 {
      font-family: 'Source Serif 4', serif;
      font-size: 1.3rem;
      color: var(--bleu);
    }
    .ecran-fin p { font-size: 0.9rem; color: #555; line-height: 1.6; max-width: 420px; }

    @media (max-width: 500px) {
      .card { padding: 22px 18px 20px; }
      .header-texte h1 { font-size: 1.15rem; }
      .enonce { font-size: 1rem; }
    }
  </style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="drapeau" aria-hidden="true">
      <span class="bl"></span><span class="wh"></span><span class="rd"></span>
    </div>
    <div class="header-texte">
      <div class="sous-titre">Mathématiques — CM2</div>
      <h1>Les nombres décimaux</h1>
    </div>
  </div>
  <div class="position-bar" id="positionBar" role="status" aria-label="Progression"></div>
</header>

<div class="card" id="mainCard">

  <!-- ZONE SOUS-EXERCICE -->
  <div id="zoneQuestion" style="display:flex; flex-direction:column; flex-grow:1;">
    <div class="badge-row">
      <div class="badge-niveau"><span class="puce"></span><span id="labelNiveau">Niveau 1</span></div>
      <div class="badge-exercice" id="labelExercice">Exercice 1.1</div>
    </div>
    <div class="sous-ex-compteur" id="sousExCompteur"></div>
    <p class="enonce" id="enonce"></p>
    <div class="options" id="options"></div>
    <div class="feedback" id="feedback"></div>
    <div class="actions">
      <button class="btn btn-valider" id="btnValider" disabled>Valider</button>
      <button class="btn btn-suite"   id="btnSuite"   style="display:none">Question suivante &#x2192;</button>
    </div>
  </div>

  <!-- BILAN D'UN EXERCICE (3 sous-exercices) -->
  <div class="ecran-bilan" id="zoneBilan">
    <div class="bilan-icone" id="bilanIcone">🎯</div>
    <div class="bilan-score"><span id="bilanScore">0</span> <span>/ 3</span></div>
    <div class="detail-sous-ex" id="bilanDetail"></div>
    <h2 id="bilanTitre">Bilan</h2>
    <p  id="bilanTexte"></p>
    <button class="btn btn-suite" id="btnBilan">Continuer &#x2192;</button>
  </div>

  <!-- TRANSITION ENTRE NIVEAUX -->
  <div class="ecran-transition" id="zoneTransition">
    <div class="transition-icone" id="transitionIcone">🌟</div>
    <h2 id="transitionTitre"></h2>
    <p  id="transitionTexte"></p>
    <button class="btn btn-suite" id="btnTransition">Continuer &#x2192;</button>
  </div>

  <!-- FIN DE PARCOURS -->
  <div class="ecran-fin" id="zoneFin">
    <div class="trophee">🏅</div>
    <h2>Parcours terminé !</h2>
    <p>Félicitations ! Tu as réussi le niveau 4 et maîtrises maintenant les nombres décimaux.</p>
    <button class="btn btn-valider" id="btnRecommencer">Recommencer depuis le début</button>
  </div>

</div><!-- /card -->

<script>
/* ================================================================
   DONNÉES : 4 niveaux × 3 exercices × 3 sous-exercices
   ================================================================ */
const PARCOURS = [

  /* NIVEAU 1 — Lire et écrire les décimaux */
  {
    label: "Niveau 1",
    theme: "Lire et écrire les décimaux",
    exercices: [
      {
        label: "Exercice 1.1",
        questions: [
          {
            enonce: "Dans le nombre <strong>4,7</strong>, que représente le chiffre <strong>7</strong> ?",
            options: ["7 unités", "7 dixièmes", "7 centièmes", "7 dizaines"],
            correct: 1,
            ok:  "Exact ! Après la virgule, le premier chiffre représente les dixièmes.",
            nok: "Après la virgule, le premier chiffre représente les dixièmes. Ici : 7 dixièmes."
          },
          {
            enonce: "Quel nombre se trouve <strong>entre 2 et 3</strong> sur la droite numérique ?",
            options: ["3,2", "1,9", "2,5", "4,0"],
            correct: 2,
            ok:  "Bravo ! 2,5 se situe bien entre 2 et 3.",
            nok: "La bonne réponse est 2,5, qui se place entre 2 et 3 sur la droite numérique."
          },
          {
            enonce: "Comment écrit-on <strong>« cinq unités et trois dixièmes »</strong> en chiffres ?",
            options: ["53", "5,03", "5,3", "0,53"],
            correct: 2,
            ok:  "Parfait ! Cinq unités et trois dixièmes = 5,3.",
            nok: "Cinq unités → 5 (avant la virgule), trois dixièmes → 3 (premier chiffre après). Réponse : 5,3."
          }
        ]
      },
      {
        label: "Exercice 1.2",
        questions: [
          {
            enonce: "Dans le nombre <strong>3,08</strong>, que représente le chiffre <strong>8</strong> ?",
            options: ["8 unités", "8 dixièmes", "8 centièmes", "8 dizaines"],
            correct: 2,
            ok:  "Exact ! Le deuxième chiffre après la virgule représente les centièmes.",
            nok: "Le deuxième chiffre après la virgule représente les centièmes. Ici : 8 centièmes."
          },
          {
            enonce: "Comment écrit-on <strong>« deux unités et huit centièmes »</strong> ?",
            options: ["2,8", "28", "2,08", "0,28"],
            correct: 2,
            ok:  "Parfait ! Deux unités et huit centièmes = 2,08. Le zéro occupe la place des dixièmes.",
            nok: "Deux unités → 2 ; zéro dixième → 0 ; huit centièmes → 8. Réponse : 2,08."
          },
          {
            enonce: "Quel nombre se lit <strong>« zéro virgule six »</strong> ?",
            options: ["6", "0,6", "0,06", "6,0"],
            correct: 1,
            ok:  "Bravo ! Zéro virgule six = 0,6 : zéro unité et six dixièmes.",
            nok: "Zéro virgule six = 0,6 : zéro avant la virgule, six dixièmes après."
          }
        ]
      },
      {
        label: "Exercice 1.3",
        questions: [
          {
            enonce: "Dans le nombre <strong>12,45</strong>, que représente le chiffre <strong>4</strong> ?",
            options: ["4 unités", "4 dixièmes", "4 centièmes", "4 dizaines"],
            correct: 1,
            ok:  "Exact ! Dans 12,45, le 4 est le premier chiffre après la virgule : 4 dixièmes.",
            nok: "Le premier chiffre après la virgule représente les dixièmes. Ici : 4 dixièmes."
          },
          {
            enonce: "Quel nombre correspond à <strong>« dix unités et cinq centièmes »</strong> ?",
            options: ["10,5", "10,05", "105", "1,05"],
            correct: 1,
            ok:  "Parfait ! Dix unités et cinq centièmes = 10,05.",
            nok: "Dix unités → 10 ; zéro dixième → 0 ; cinq centièmes → 5. Réponse : 10,05."
          },
          {
            enonce: "Combien y a-t-il de dixièmes dans le nombre <strong>2,7</strong> ?",
            options: ["2", "27", "7", "0"],
            correct: 2,
            ok:  "Bravo ! Dans 2,7, il y a 7 dixièmes — c'est le premier chiffre après la virgule.",
            nok: "Le premier chiffre après la virgule indique les dixièmes. Dans 2,7 : 7 dixièmes."
          }
        ]
      }
    ]
  },

  /* NIVEAU 2 — Comparer et ordonner */
  {
    label: "Niveau 2",
    theme: "Comparer et ordonner",
    exercices: [
      {
        label: "Exercice 2.1",
        questions: [
          {
            enonce: "Quel signe convient entre <strong>3,4</strong> et <strong>3,40</strong> ?",
            options: ["&lt;", "&gt;", "=", "On ne peut pas comparer"],
            correct: 2,
            ok:  "Exact ! 3,4 = 3,40. Un zéro en fin de décimal ne change pas la valeur.",
            nok: "3,4 = 3,40. Ajouter un zéro après le dernier chiffre décimal ne change pas la valeur."
          },
          {
            enonce: "Lequel de ces nombres est le plus grand ?",
            options: ["2,09", "2,9", "2,19", "2,01"],
            correct: 1,
            ok:  "Bravo ! 2,9 est le plus grand : 9 dixièmes &gt; 1 dixième ou 0 dixième.",
            nok: "2,9 est le plus grand. On compare les dixièmes : 9 &gt; 1 &gt; 0."
          },
          {
            enonce: "Range dans l'ordre croissant : <strong>1,3 — 0,9 — 1,03</strong>",
            options: [
              "1,3 &lt; 0,9 &lt; 1,03",
              "0,9 &lt; 1,03 &lt; 1,3",
              "1,03 &lt; 0,9 &lt; 1,3",
              "0,9 &lt; 1,3 &lt; 1,03"
            ],
            correct: 1,
            ok:  "Parfait ! 0,9 &lt; 1,03 &lt; 1,3. On compare les unités d'abord, puis les dixièmes.",
            nok: "Ordre croissant : 0,9 — 1,03 — 1,3. Méthode : unités d'abord (0 &lt; 1), puis dixièmes (0 &lt; 3)."
          }
        ]
      },
      {
        label: "Exercice 2.2",
        questions: [
          {
            enonce: "Quel signe convient entre <strong>0,7</strong> et <strong>0,70</strong> ?",
            options: ["&lt;", "&gt;", "=", "Impossible à dire"],
            correct: 2,
            ok:  "Exact ! 0,7 = 0,70. Les zéros finaux ne changent pas la valeur.",
            nok: "0,7 = 0,70. Un zéro ajouté en fin de partie décimale ne modifie pas la valeur."
          },
          {
            enonce: "Lequel de ces nombres est le plus petit ?",
            options: ["5,1", "5,01", "5,10", "5,11"],
            correct: 1,
            ok:  "Bravo ! 5,01 est le plus petit : 0 dixième et 1 centième.",
            nok: "5,01 est le plus petit : 0 dixième, alors que les autres ont au moins 1 dixième."
          },
          {
            enonce: "Range dans l'ordre décroissant : <strong>4,5 — 4,05 — 4,50</strong>",
            options: [
              "4,05 &gt; 4,5 &gt; 4,50",
              "4,5 &gt; 4,50 &gt; 4,05",
              "4,5 = 4,50 &gt; 4,05",
              "4,50 &gt; 4,5 &gt; 4,05"
            ],
            correct: 2,
            ok:  "Parfait ! 4,5 = 4,50 &gt; 4,05. Les deux premiers sont égaux, puis vient 4,05.",
            nok: "4,5 = 4,50 (zéro final) et les deux sont supérieurs à 4,05."
          }
        ]
      },
      {
        label: "Exercice 2.3",
        questions: [
          {
            enonce: "Quel nombre est compris entre <strong>3,2</strong> et <strong>3,4</strong> ?",
            options: ["3,5", "3,1", "3,3", "3,45"],
            correct: 2,
            ok:  "Exact ! 3,3 est bien compris entre 3,2 et 3,4.",
            nok: "La bonne réponse est 3,3 : 3,2 &lt; 3,3 &lt; 3,4."
          },
          {
            enonce: "Lequel de ces nombres est entre <strong>0,5</strong> et <strong>1</strong> ?",
            options: ["0,4", "1,2", "0,75", "1,05"],
            correct: 2,
            ok:  "Bravo ! 0,75 est bien entre 0,5 et 1.",
            nok: "La bonne réponse est 0,75 : 0,5 &lt; 0,75 &lt; 1."
          },
          {
            enonce: "Range dans l'ordre croissant : <strong>2,2 — 2,02 — 2,22</strong>",
            options: [
              "2,02 &lt; 2,2 &lt; 2,22",
              "2,2 &lt; 2,02 &lt; 2,22",
              "2,02 &lt; 2,22 &lt; 2,2",
              "2,2 &lt; 2,22 &lt; 2,02"
            ],
            correct: 0,
            ok:  "Parfait ! 2,02 &lt; 2,2 &lt; 2,22. On compare les dixièmes : 0 &lt; 2, puis les centièmes : 0 &lt; 2.",
            nok: "Ordre croissant : 2,02 — 2,2 — 2,22. On compare dixièmes d'abord : 0 &lt; 2, puis centièmes."
          }
        ]
      }
    ]
  },

  /* NIVEAU 3 — Additionner et soustraire */
  {
    label: "Niveau 3",
    theme: "Additionner et soustraire",
    exercices: [
      {
        label: "Exercice 3.1",
        questions: [
          {
            enonce: "Calcule : <strong>4,5 + 2,3</strong>",

/* ================================================================
   ÉTAT
   ================================================================ */
let etat = {
  niveau:       0,   // 0-3
  exercice:     0,   // 0-2
  sousEx:       0,   // 0-2
  selectionne:  null,
  valide:       false,
  reponsesEx:   [null, null, null],  // résultats des 3 sous-exercices en cours
  resultats:    Array.from({length: 4}, function() { return [[null,null,null],[null,null,null],[null,null,null]]; })
};

/* ================================================================
   INDICATEUR DE POSITION
   ================================================================ */
function renderPosition() {
  const bar = document.getElementById('positionBar');
  bar.innerHTML = '';

  PARCOURS.forEach(function(niv, ni) {
    const bloc = document.createElement('div');
    bloc.className = 'niveau-pip' + (ni === etat.niveau ? ' niveau-actif' : '');

    const lbl = document.createElement('div');
    lbl.className = 'pip-label';
    lbl.textContent = 'N' + (ni + 1);
    bloc.appendChild(lbl);

    const exRow = document.createElement('div');
    exRow.className = 'pip-exercices';

    niv.exercices.forEach(function(ex, ei) {
      const exBloc = document.createElement('div');
      exBloc.className = 'pip-ex';

      ex.questions.forEach(function(_, qi) {
        const pip = document.createElement('div');
        pip.className = 'pip';
        const res = etat.resultats[ni][ei][qi];
        if (res === true)  pip.classList.add('reussi');
        if (res === false) pip.classList.add('echoue');
        if (ni === etat.niveau && ei === etat.exercice && qi === etat.sousEx && !etat.valide && res === null) {
          pip.classList.add('actif');
        }
        exBloc.appendChild(pip);
      });

      exRow.appendChild(exBloc);
    });

    bloc.appendChild(exRow);
    bar.appendChild(bloc);

    if (ni < PARCOURS.length - 1) {
      const sep = document.createElement('div');
      sep.className = 'sep-niveau';
      bar.appendChild(sep);
    }
  });
}

/* ================================================================
   COMPTEUR DES SOUS-EXERCICES (barres colorées dans la carte)
   ================================================================ */
function renderSousExCompteur() {
  const ctr = document.getElementById('sousExCompteur');
  ctr.innerHTML = '';
  for (let i = 0; i < 3; i++) {
    const d = document.createElement('div');
    d.className = 'sous-ex-dot';
    if (i < etat.sousEx) {
      d.classList.add(etat.reponsesEx[i] ? 'ok' : 'nok');
    } else if (i === etat.sousEx) {
      d.classList.add('actif');
    }
    ctr.appendChild(d);
  }
}

/* ================================================================
   AFFICHAGE D'UN SOUS-EXERCICE
   ================================================================ */
function afficherQuestion() {
  const niv = PARCOURS[etat.niveau];
  const ex  = niv.exercices[etat.exercice];
  const q   = ex.questions[etat.sousEx];

  // Montrer la bonne zone
  document.getElementById('zoneQuestion').style.display    = 'flex';
  document.getElementById('zoneBilan').style.display       = 'none';
  document.getElementById('zoneTransition').style.display  = 'none';
  document.getElementById('zoneFin').style.display         = 'none';

  // Badges
  document.getElementById('labelNiveau').textContent   = niv.label + ' \u2014 ' + niv.theme;
  document.getElementById('labelExercice').textContent = ex.label;

  // Compteur
  renderSousExCompteur();

  // Énoncé
  document.getElementById('enonce').innerHTML = q.enonce;

  // Options
  const oz = document.getElementById('options');
  oz.innerHTML = '';
  ['A','B','C','D'].forEach(function(lettre, i) {
    const btn = document.createElement('button');
    btn.className = 'opt';
    btn.innerHTML = '<span class="lettre">' + lettre + '</span><span>' + q.options[i] + '</span>';
    btn.addEventListener('click', function() { selectionner(i); });
    oz.appendChild(btn);
  });

  // Reset feedback et boutons
  const fb = document.getElementById('feedback');
  fb.style.display = 'none';
  fb.className = 'feedback';
  fb.textContent = '';

  const btnV = document.getElementById('btnValider');
  const btnS = document.getElementById('btnSuite');
  btnV.style.display = 'inline-flex';
  btnV.disabled = true;
  btnS.style.display = 'none';

  etat.selectionne = null;
  etat.valide = false;

  renderPosition();
}

/* ================================================================
   SÉLECTION
   ================================================================ */
function selectionner(idx) {
  if (etat.valide) return;
  etat.selectionne = idx;
  document.querySelectorAll('.opt').forEach(function(b, i) {
    b.classList.toggle('selectionne', i === idx);
  });
  document.getElementById('btnValider').disabled = false;
}

/* ================================================================
   VALIDATION D'UN SOUS-EXERCICE
   ================================================================ */
function valider() {
  if (etat.selectionne === null || etat.valide) return;
  etat.valide = true;

  const q = PARCOURS[etat.niveau].exercices[etat.exercice].questions[etat.sousEx];
  const reussi = etat.selectionne === q.correct;

  // Enregistrer
  etat.reponsesEx[etat.sousEx] = reussi;
  etat.resultats[etat.niveau][etat.exercice][etat.sousEx] = reussi;

  // Colorier les options
  document.querySelectorAll('.opt').forEach(function(b, i) {
    b.disabled = true;
    if (i === q.correct) b.classList.add('correct');
    else if (i === etat.selectionne && !reussi) b.classList.add('faux');
  });

  // Feedback
  const fb = document.getElementById('feedback');
  fb.className = 'feedback ' + (reussi ? 'ok' : 'nok');
  fb.textContent = (reussi ? '\u2705 ' : '\u274C ') + (reussi ? q.ok : q.nok);
  fb.style.display = 'block';

  // Bouton suite
  const btnV = document.getElementById('btnValider');
  const btnS = document.getElementById('btnSuite');
  btnV.style.display = 'none';

  const dernierSousEx = etat.sousEx === 2;
  btnS.textContent = dernierSousEx ? 'Voir le bilan \u2192' : 'Question suivante \u2192';
  btnS.style.display = 'inline-flex';

  renderPosition();
  renderSousExCompteur();
}

/* ================================================================
   SUITE : sous-exercice suivant ou bilan
   ================================================================ */
function suite() {
  if (etat.sousEx < 2) {
    etat.sousEx++;
    afficherQuestion();
  } else {
    afficherBilan();
  }
}

/* ================================================================
   BILAN D'UN EXERCICE
   ================================================================ */
function afficherBilan() {
  document.getElementById('zoneQuestion').style.display   = 'none';
  document.getElementById('zoneBilan').style.display      = 'flex';
  document.getElementById('zoneTransition').style.display = 'none';
  document.getElementById('zoneFin').style.display        = 'none';

  const score = etat.reponsesEx.filter(function(r) { return r === true; }).length;
  const reussi = score >= 2;

  // Score
  document.getElementById('bilanScore').textContent = score;

  // Détail visuel
  const detail = document.getElementById('bilanDetail');
  detail.innerHTML = '';
  etat.reponsesEx.forEach(function(r, i) {
    const d = document.createElement('div');
    d.className = 'detail-puce ' + (r ? 'ok' : 'nok');
    d.textContent = (i + 1);
    detail.appendChild(d);
  });

  const dernierNiveau  = etat.niveau === PARCOURS.length - 1;
  const dernierExercice = etat.exercice === 2;

  if (reussi) {
    document.getElementById('bilanIcone').textContent = '\uD83C\uDF1F';
    document.getElementById('bilanTitre').textContent = 'Exercice réussi !';
    if (dernierNiveau) {
      document.getElementById('bilanTexte').textContent =
        'Bravo ! Tu as réussi le dernier exercice du niveau 4. Parcours terminé !';
      document.getElementById('btnBilan').textContent = 'Voir le bilan final \u2192';
      document.getElementById('btnBilan').onclick = function() { afficherFin(); };
    } else {
      const suivant = PARCOURS[etat.niveau + 1];
      document.getElementById('bilanTexte').textContent =
        'Tu passes au ' + suivant.label + ' : ' + suivant.theme + '.';
      document.getElementById('btnBilan').textContent = 'Passer au ' + suivant.label + ' \u2192';
      document.getElementById('btnBilan').onclick = function() { afficherTransitionMontee(); };
    }
  } else {
    document.getElementById('bilanIcone').textContent = '\uD83D\uDCDA';
    document.getElementById('bilanTitre').textContent = 'Pas encore !';
    if (!dernierExercice) {
      const suivantEx = PARCOURS[etat.niveau].exercices[etat.exercice + 1];
      document.getElementById('bilanTexte').textContent =
        'On essaie une variante : ' + suivantEx.label + '.';
      document.getElementById('btnBilan').textContent = 'Essayer ' + suivantEx.label + ' \u2192';
      document.getElementById('btnBilan').onclick = function() { passerExerciceSuivant(); };
    } else {
      if (etat.niveau === 0) {
        document.getElementById('bilanTexte').textContent =
          'On reprend depuis le début du Niveau 1 pour consolider les bases.';
        document.getElementById('btnBilan').textContent = 'Recommencer le Niveau 1 \u2192';
        document.getElementById('btnBilan').onclick = function() { reinitNiveau(0); };
      } else {
        const precNiveau = PARCOURS[etat.niveau - 1];
        document.getElementById('bilanTexte').textContent =
          'On revient au ' + precNiveau.label + ' pour consolider les bases.';
        document.getElementById('btnBilan').textContent = 'Retour au ' + precNiveau.label + ' \u2192';
        document.getElementById('btnBilan').onclick = function() { afficherTransitionDescente(); };
      }
    }
  }

  renderPosition();
}

/* ================================================================
   TRANSITIONS ENTRE NIVEAUX
   ================================================================ */
function afficherTransitionMontee() {
  const suivant = PARCOURS[etat.niveau + 1];
  document.getElementById('zoneQuestion').style.display   = 'none';
  document.getElementById('zoneBilan').style.display      = 'none';
  document.getElementById('zoneTransition').style.display = 'flex';
  document.getElementById('zoneFin').style.display        = 'none';

  document.getElementById('transitionIcone').textContent = '\uD83C\uDF1F';
  document.getElementById('transitionTitre').textContent = 'Niveau réussi !';
  document.getElementById('transitionTexte').textContent =
    'Bravo ! Tu passes au ' + suivant.label + ' : ' + suivant.theme + '.';

  const btnT = document.getElementById('btnTransition');
  btnT.textContent = 'Commencer le ' + suivant.label + ' \u2192';
  btnT.onclick = function() {
    etat.niveau++;
    etat.exercice = 0;
    etat.sousEx   = 0;
    etat.reponsesEx = [null, null, null];
    afficherQuestion();
  };
  renderPosition();
}

function afficherTransitionDescente() {
  const prec = PARCOURS[etat.niveau - 1];
  document.getElementById('zoneQuestion').style.display   = 'none';
  document.getElementById('zoneBilan').style.display      = 'none';
  document.getElementById('zoneTransition').style.display = 'flex';
  document.getElementById('zoneFin').style.display        = 'none';

  document.getElementById('transitionIcone').textContent = '\uD83D\uDD19';
  document.getElementById('transitionTitre').textContent = 'On consolide !';
  document.getElementById('transitionTexte').textContent =
    'Pas d\'inquiétude. On revient au ' + prec.label + ' pour renforcer les bases.';

  const btnT = document.getElementById('btnTransition');
  btnT.textContent = 'Retour au ' + prec.label + ' \u2192';
  btnT.onclick = function() { reinitNiveau(etat.niveau - 1); };
  renderPosition();
}

/* ================================================================
   NAVIGATION
   ================================================================ */
function passerExerciceSuivant() {
  etat.exercice++;
  etat.sousEx     = 0;
  etat.reponsesEx = [null, null, null];
  afficherQuestion();
}

function reinitNiveau(n) {
  etat.niveau     = n;
  etat.exercice   = 0;
  etat.sousEx     = 0;
  etat.reponsesEx = [null, null, null];
  etat.resultats[n] = [[null,null,null],[null,null,null],[null,null,null]];
  afficherQuestion();
}

/* ================================================================
   FIN DE PARCOURS
   ================================================================ */
function afficherFin() {
  document.getElementById('zoneQuestion').style.display   = 'none';
  document.getElementById('zoneBilan').style.display      = 'none';
  document.getElementById('zoneTransition').style.display = 'none';
  document.getElementById('zoneFin').style.display        = 'flex';
  renderPosition();
}

/* ================================================================
   RECOMMENCER
   ================================================================ */
function recommencer() {
  etat.niveau      = 0;
  etat.exercice    = 0;
  etat.sousEx      = 0;
  etat.selectionne = null;
  etat.valide      = false;
  etat.reponsesEx  = [null, null, null];
  etat.resultats   = Array.from({length: 4}, function() {
    return [[null,null,null],[null,null,null],[null,null,null]];
  });
  afficherQuestion();
}

/* ================================================================
   INIT
   ================================================================ */
document.addEventListener('DOMContentLoaded', function() {
  document.getElementById('btnValider').addEventListener('click', valider);
  document.getElementById('btnSuite').addEventListener('click', suite);
  document.getElementById('btnRecommencer').addEventListener('click', recommencer);
  afficherQuestion();
});
</script>
